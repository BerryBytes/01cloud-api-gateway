version: "3"
services:
  krakend:
    image: devopsfaith/krakend
    volumes:
      - .:/etc/krakend
    ports:
      - "8080:8080"
    environment:
      - FC_ENABLE=1
      - FC_SETTINGS=config/dev/settings/prod
      - FC_PARTIALS=config/dev/partials
      - FC_TEMPLATES=config/common/templates
      - FC_OUT=tmp/out.json
      - SERVICE_NAME=KrakenD API Gateway
    command: [ "run", "-dc", "krakend.tmpl", "" ]